
name: Split-TM macOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build Universal macOS App
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Universal macOS application
        run: npm run dist:mac

      - name: Verify build output
        run: |
          echo "Checking generated installers..."
          ls -lah release/
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Split-TM-macOS-Universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
